notes: >
  Geiping et al. arXiv:2502.05171 -- loop a recurrent block r times per token instead of
  stacking r distinct layers. Reference implementation + pretrained model (huginn-0125,
  3.5B -- too big to reuse directly): github.com/seal-rg/recurrent-pretraining,
  huggingface.co/tomg-group-umd/huginn-0125. Before choosing how to decode intermediate
  states, see "Looped Transformers under the Jacobian Lens" (reading list) -- loop
  iterations largely overwrite rather than accumulate state. Stub config --
  latentreasoning/mechanisms/recurrent_depth.py is unimplemented; fill in alongside it.
