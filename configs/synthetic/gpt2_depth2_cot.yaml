# Step 2: GPT-2 cot on the synthetic v2 depth2 task, trained with the VANILLA Coconut repo
# (github.com/facebookresearch/coconut @ 27273cb8), adapted from Dilgren & Wiegreffe's
# args_coconut-cot-no_cot/gpt2_prosqa_cot.yaml. Differences from that file, all deliberate:
#   * 1 GPU instead of 4: batch_size_training 32 x gradient_accumulation_steps 4 = effective
#     128 (= their 4 GPUs x 32). Per-device batch is unchanged from the reference, so peak
#     memory is what it was there; 64 x 2 likely also fits a 24 GB card for GPT-2 at these
#     sequence lengths (<= ~230 tokens) but is untested -- kept the safe choice.
#   * train/val paths -> our synthetic JSON; val_path = valid_monitor.json (30 per level)
#     so run.py's per-epoch generation eval stays cheap (it decodes val at batch size 1).
#   * save_only_improve True (their file: False): run.py then writes checkpoint_<epoch>
#     only when monitor accuracy strictly improves, so the newest checkpoint_N in
#     save_path/name is the best-on-monitor one (and disk stays ~0.5 GB x #improvements
#     instead of 0.5 GB x 25). Same setting as Coconut's own args/gsm_cot.yaml.
# run.py has NO early stopping and a constant LR (no scheduler). The v2 plan
# trains this CoT stage for 3 epochs (train_synthetic.py's CoT reached 1.000 on the monitor by epoch 3;
# 25 epochs would spend ~0.6 h/epoch for nothing). Gate G1 = valid.json CoT >= 0.97 at EVERY level, uncapped
# (scripts/pod/coconut_v2.sh gate). If it fails: raise num_epochs to 5 and relaunch under the SAME name
# (run.py resumes on purpose); a second failure stops Coconut.
#
# Launch (from the Coconut checkout -- run.py imports coconut.py/dataset.py from cwd;
# Coconut venv: torch 2.5.1 / transformers 4.46.2 / wandb 0.18.7):
#   cd /workspace/coconut && WANDB_MODE=offline torchrun --nnodes 1 --nproc_per_node 1 \
#       run.py /workspace/ai-capstone/configs/synthetic/gpt2_depth2_cot.yaml 2>&1 | tee /workspace/logs/gpt2_depth2_cot.log
# (keep the log: scripts/eval_synthetic_coconut.py --train_log parses per-epoch training
# seconds and monitor accuracy from it). Then evaluate per level on test.json with
# scripts/eval_synthetic_coconut.py --method cot --checkpoint_path <save_path>/<name>/checkpoint_<latest>.
# Edit save_path / *_path if the directory layout differs. If save_path/name already contains
# checkpoints, run.py silently RESUMES from the newest one (preemption logic) -- use a
# fresh name for a fresh run.

project: coconut
save_path: /workspace/coconut_runs
name: gpt2_depth2_cot

only_eval: False

coconut: False
cot: True
no_thoughts: False
no_cot: False

c_thought: 0
epochs_per_stage: 1
max_latent_stage: 0
pad_latent_to_max: True

save_only_improve: True
uniform_prob: 0.0
model_id: openai-community/gpt2
load_model_path: None
seed: 0
resume: 0
bf16: False
train_path: /workspace/synthetic_data_v2/depth2/train.json
val_path: /workspace/synthetic_data_v2/depth2/valid_monitor.json
reset_optimizer: False
batch_size_training: 32
debug: False
gradient_accumulation_steps: 4
num_epochs: 3
lr: !!float "1e-4"
weight_decay: 0.01
