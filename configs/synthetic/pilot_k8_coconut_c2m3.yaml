# PILOT_K8.md: published GSM8K-Aug recipe arm. Coconut c_thought 2 x max_latent_stage 3 = 6 latents (Hao et al.; Dilgren & Wiegreffe Table 4).
# Data depth2_k8 (scripts/make_pilot_k8.py): 25k train items, k = 1-8 only. Init = round-1 CoT gpt2_depth2_cot/checkpoint_3.
# Schedule: epochs_per_stage 3, max_latent_stage 3; resume 3 skips stage 0 (epochs 0-2); epochs 3-11 = stages 1-3;
# epochs 12-16 = final all-latent stage (5 epochs; rules 4-8 never get latents); checkpoints checkpoint_4 .. checkpoint_17,
# final-stage ones checkpoint_13 .. _17; selection = best of checkpoint_15/16/17 on depth2_k8/valid.json.
# load_model_path / paths / micro-batch are rendered by scripts/pod/coconut_v2.sh. Launch via lrm_work/queue_pilot_k8_*.sh.

project: coconut
save_path: /workspace/coconut_runs
name: pilot_k8_coconut_c2m3

only_eval: False

coconut: True
cot: False
no_thoughts: False
no_cot: False

c_thought: 2
epochs_per_stage: 3
max_latent_stage: 3
pad_latent_to_max: True

save_only_improve: False
uniform_prob: 0.0
model_id: openai-community/gpt2
load_model_path: /workspace/coconut_runs/gpt2_depth2_cot/checkpoint_<BEST>  # rendered by coconut_v2.sh
seed: 0
resume: 3
bf16: False
train_path: /workspace/synthetic_data_v2/depth2_k8/train.json
val_path: /workspace/synthetic_data_v2/depth2_k8/valid_monitor.json
reset_optimizer: True
batch_size_training: 32
debug: False
gradient_accumulation_steps: 4
num_epochs: 17
lr: !!float "1e-4"
weight_decay: 0.01
