# Step 3, option "A-lite" (chosen by Henning 2026-10-11): option A (gpt2_depth_coconut_A_gsm8k_style.yaml,
# = Coconut's args/gsm_coconut.yaml curriculum: c_thought 2, max_latent_stage 3) with
# epochs_per_stage 1 instead of 3, to fit the Phase A budget. Initialized from the step-2 depth CoT
# checkpoint (gpt2_depth_cot/checkpoint_1, test 0.999), resume 1 = skip the stage-0 (CoT) epoch.
# Epoch e -> stage e: epochs 1-3 = stages 1-3 (first k written steps -> 2k latents, rest written);
# epochs 4-6 = stage 4 > max_latent_stage -> ALL written steps dropped, 6 latents (pad_latent_to_max).
# So 3 epochs of curriculum + 3 epochs at the final all-latent stage. save_only_improve False: one
# checkpoint per epoch (stage switches drop accuracy, "best" would freeze at an early stage);
# evaluate the last one (final stage).
# Launch: cd /workspace/coconut && WANDB_MODE=disabled torchrun --nnodes 1 --nproc_per_node 1 run.py <this file>

project: coconut
save_path: /workspace/coconut_runs
name: gpt2_depth_coconut_A_lite

only_eval: False

coconut: True
cot: False
no_thoughts: False
no_cot: False

c_thought: 2
epochs_per_stage: 1
max_latent_stage: 3
pad_latent_to_max: True

save_only_improve: False
uniform_prob: 0.0
model_id: openai-community/gpt2
load_model_path: /workspace/coconut_runs/gpt2_depth_cot/checkpoint_1
seed: 0
resume: 1
bf16: False
train_path: /workspace/synthetic_data/depth/train.json
val_path: /workspace/synthetic_data/depth/valid_monitor.json
reset_optimizer: True
batch_size_training: 32
debug: False
gradient_accumulation_steps: 4
num_epochs: 7
lr: !!float "1e-4"
weight_decay: 0.01
